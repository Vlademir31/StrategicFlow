services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: strategicflow
      POSTGRES_PASSWORD: strategicflow
      POSTGRES_DB: strategicflow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strategicflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      DB_URL: postgresql://strategicflow:strategicflow@db:5432/strategicflow
      JWT_SECRET: super-secret-key
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
